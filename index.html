    // =========================================================================

    const state = {

    const escapeHtml = (str) =>
      String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");

    const normalizeAugmentName = (rawName) => {
      const n = String(rawName || "").trim();
      return AUGMENT_NAME_CORRECTIONS[n] || n;
    };

    const normalizeCDragonAsset = (rawPath) => {
      if (!rawPath) return "";
      const trimmed = String(rawPath).trim();
      if (trimmed.startsWith("http://") || trimmed.startsWith("https://")) return trimmed;
      let cleaned = trimmed.toLowerCase();
      if (cleaned.startsWith("/lol-game-data/assets/")) {
        cleaned = cleaned.slice("/lol-game-data/assets/".length);
      } else if (cleaned.startsWith("lol-game-data/assets/")) {
        cleaned = cleaned.slice("lol-game-data/assets/".length);
      }
      return CDRAGON_ASSET_PREFIX + cleaned.replace(/^\/+/, "");
    };

    const calibrateNumericRarityMap = (rawAugs = []) => {
      const votes = {};
      const numSet = new Set();
      rawAugs.forEach((a) => {
        if (typeof a?.rarity !== "number") return;
        const code = a.rarity;
        numSet.add(code);
        const name = normalizeAugmentName(a.nameTRA || a.name || "");
        const known = OFFICIAL_AUGMENT_RARITY_KO[name];
        if (known) {
          if (!votes[code]) votes[code] = { 실버: 0, 골드: 0, 프리즘: 0 };
          votes[code][known] += 1;
        }
      });
      const result = {};
      Object.entries(votes).forEach(([code, counts]) => {
        const best = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
        if (best && best[1] > 0) result[Number(code)] = best[0];
      });
      const sorted = Array.from(numSet).sort((a, b) => a - b);
      if (Object.keys(result).length < 3 && sorted.length >= 3) {
        if (numSet.has(4) && numSet.has(8)) {
          if (!result[0]) result[0] = "실버";
          if (!result[1]) result[1] = "실버";
          if (!result[4]) result[4] = "골드";
          if (!result[8]) result[8] = "프리즘";
        } else {
          if (!result[sorted[0]]) result[sorted[0]] = "실버";
          if (!result[sorted[1]]) result[sorted[1]] = "골드";
          if (!result[sorted[2]]) result[sorted[2]] = "프리즘";
        }
      }
      return result;
    };

    const resolveOfficialRarity = (rawRarity, augName = "", numMap = {}) => {
      const cleanName = normalizeAugmentName(augName);
      if (OFFICIAL_AUGMENT_RARITY_KO[cleanName]) return OFFICIAL_AUGMENT_RARITY_KO[cleanName];
      if (typeof rawRarity === "string") {
        const lower = rawRarity.trim().toLowerCase();
        if (lower.includes("prism") || lower.includes("프리즘")) return "프리즘";
        if (lower.includes("gold") || lower.includes("골드")) return "골드";
        if (lower.includes("silver") || lower.includes("실버")) return "실버";
        const asNum = Number(lower);
        if (Number.isFinite(asNum)) {
          if (numMap[asNum]) return numMap[asNum];
          if (asNum === 2 || asNum === 8) return "프리즘";
          if (asNum === 1 || asNum === 4) return "골드";
          return "실버";
        }
      }
      if (typeof rawRarity === "number") {
        if (numMap[rawRarity]) return numMap[rawRarity];
        if (rawRarity === 2 || rawRarity === 8) return "프리즘";
        if (rawRarity === 1 || rawRarity === 4) return "골드";
        return "실버";
      }
      return "실버";
    };

    const getEntityIcons = (name) => {
      const meta = PLAN_ENTITY_TOOLTIPS[name] || { type: "augment", rarity: "프리즘" };
      const candidates = [name, ...(meta.aliases || [])];
      if (meta.type === "item") {
        const isPrismatic = meta.rarity === "프리즘";
        let cdIcon = "";
        let ddId = meta.itemId || null;
        for (const c of candidates) {
          if (!cdIcon) {
            cdIcon = isPrismatic
              ? (state.cdPrismaticIconMap[c] || state.cdItemIconMap[c] || "")
              : (state.cdItemIconMap[c] || "");
          }
          if (!ddId) {
            ddId = isPrismatic
              ? (state.ddPrismaticItemIdMap[c] || state.ddItemNameMap[c] || null)
              : (state.ddItemNameMap[c] || null);
          }
        }
        const ddIcon = ddId ? DD_ITEM_IMG(ddId, state.ddVersion) : "";
        return {
          primary: ddIcon || cdIcon,
          fallback: ddIcon && cdIcon && ddIcon !== cdIcon ? cdIcon : ""
        };
      }
      let augIcon = "";
      for (const c of candidates) {
        const fixed = normalizeAugmentName(c);
        if (state.cdAugmentMetaMap[fixed]?.icon) {
          augIcon = state.cdAugmentMetaMap[fixed].icon;
          break;
        }
      }
      return { primary: augIcon, fallback: "" };
    };

    const getTierNum = (tier, explicitNum = null) => {
      if (explicitNum && explicitNum >= 1 && explicitNum <= 4) return explicitNum;
      if (tier === "S") return 1;
      if (tier === "A") return 2;
      if (tier === "B") return 3;
      if (tier === "C") return 4;
      return 0;
    };

    const getTierBadgeMeta = (tierNum) => {
      if (tierNum === 1) return { label: "1티어", cls: "bg-sky-500/20 text-sky-300 border-sky-400/50", solid: "bg-sky-500 text-slate-950 border-sky-300" };
      if (tierNum === 2) return { label: "2티어", cls: "bg-emerald-500/20 text-emerald-300 border-emerald-400/50", solid: "bg-emerald-500 text-slate-950 border-emerald-300" };
      if (tierNum === 3) return { label: "3티어", cls: "bg-amber-500/20 text-amber-300 border-amber-400/45", solid: "bg-amber-500 text-slate-950 border-amber-300" };
      if (tierNum === 4) return { label: "4티어", cls: "bg-rose-500/15 text-rose-300 border-rose-500/40", solid: "bg-rose-500 text-white border-rose-300" };
      return { label: "-", cls: "bg-slate-800 text-slate-500 border-slate-700", solid: "bg-slate-700 text-slate-300 border-slate-600" };
    };

    const getRarityPillCls = (rarity) => {
      if (rarity === "프리즘") return "bg-fuchsia-500/20 text-fuchsia-200 border-fuchsia-400/50";
      if (rarity === "골드") return "bg-amber-500/20 text-amber-200 border-amber-400/50";
      return "bg-slate-600/30 text-slate-200 border-slate-400/45";
    };

    const resolveLatestItemIcon = (item, isPrismatic = false) => {
      const name = String(item?.name || "").trim();
      const rawId = Number(item?.id || 0);
      if (isPrismatic) {
        const prismId = (rawId >= 440000 && rawId < 450000) ? rawId : (state.ddPrismaticItemIdMap[name] || 0);
        if (prismId) return DD_ITEM_IMG(prismId, state.ddVersion);
        return state.cdPrismaticIconMap[name] || state.cdItemIconMap[name] || item?.icon || item?.icon_url || "";
      }
      const mappedId = (rawId >= 1000 && rawId < 7000) ? rawId : (state.ddItemNameMap[name] || rawId);
      if (mappedId) return DD_ITEM_IMG(mappedId, state.ddVersion);
      return state.cdItemIconMap[name] || item?.icon || item?.icon_url || "";
    };

    const computePatchFilteredSummary = (champ, selectedPatch, allPatchesDesc) => {
      if (!champ?.hasRealData) {
        return { tier: "-", tier_num: 0, picks: 0, avg_placement: "-", bayes_placement: 9.99, top3_rate: "-", win_rate: "-", avg_damage: 0 };
      }
      const patchStats = champ.patch_stats || {};
      const patchKeys = Object.keys(patchStats);
      if (patchKeys.length === 0) {
        const s = champ.summary || {};
        const picks = Number(s.picks || 0);
        const avg = Number(s.avg_placement ?? 3.5);
        const bp = Number(s.bayes_placement ?? (picks * avg + 25 * 3.5) / (picks + 25));
        const tier = picks < 20 ? "B" : bp <= 3.32 ? "S" : bp <= 3.46 ? "A" : bp <= 3.6 ? "B" : "C";
        return {
          tier,
          tier_num: getTierNum(tier, s.tier_num ?? s.opgg_tier),
          picks,
          avg_placement: Number(avg.toFixed(2)),
          bayes_placement: Number(bp.toFixed(2)),
          top3_rate: Number((s.top3_rate ?? 50).toFixed(1)),
          win_rate: Number((s.win_rate ?? 16.7).toFixed(1)),
          avg_damage: Math.round(s.avg_damage || 0)
        };
      }

      const weightCurve = [1.0, 0.75, 0.5, 0.35, 0.25];
      const patchWeightMap = {};
      allPatchesDesc.forEach((p, i) => {
        patchWeightMap[p] = weightCurve[Math.min(i, weightCurve.length - 1)];
      });

      const targetKeys = selectedPatch === "ALL" ? patchKeys : patchStats[selectedPatch] ? [selectedPatch] : [];
      if (targetKeys.length === 0) {
        return { tier: "-", tier_num: 0, picks: 0, avg_placement: "-", bayes_placement: 9.99, top3_rate: "-", win_rate: "-", avg_damage: 0 };
      }

      let rawTotalPicks = 0, weightedPicksSum = 0, weightedPlaceSum = 0, weightedTop3Sum = 0, weightedWinSum = 0, weightedDmgSum = 0;
      targetKeys.forEach((pKey) => {
        const st = patchStats[pKey];
        const n = Number(st.picks || 0);
        if (n <= 0) return;
        const w = selectedPatch === "ALL" ? patchWeightMap[pKey] ?? 0.5 : 1.0;
        const effN = n * w;
        rawTotalPicks += n;
        weightedPicksSum += effN;
        weightedPlaceSum += Number(st.avg_placement || 3.5) * effN;
        weightedTop3Sum += Number(st.top3_rate || 50) * effN;
        weightedWinSum += Number(st.win_rate || 16.7) * effN;
        weightedDmgSum += Number(st.avg_damage || 0) * effN;
      });

      if (rawTotalPicks === 0 || weightedPicksSum <= 0) {
        return { tier: "-", tier_num: 0, picks: 0, avg_placement: "-", bayes_placement: 9.99, top3_rate: "-", win_rate: "-", avg_damage: 0 };
      }

      const avgPlacement = Number((weightedPlaceSum / weightedPicksSum).toFixed(2));
      const bayesPlacement = Number(((weightedPicksSum * avgPlacement + 25 * 3.5) / (weightedPicksSum + 25)).toFixed(2));
      const top3Rate = Number((weightedTop3Sum / weightedPicksSum).toFixed(1));
      const winRate = Number((weightedWinSum / weightedPicksSum).toFixed(1));
      const avgDamage = Math.round(weightedDmgSum / weightedPicksSum);
      const tier = rawTotalPicks < 20 ? "B" : bayesPlacement <= 3.32 ? "S" : bayesPlacement <= 3.46 ? "A" : bayesPlacement <= 3.6 ? "B" : "C";

      return {
        tier,
        tier_num: getTierNum(tier, champ.summary?.tier_num ?? champ.summary?.opgg_tier),
        picks: rawTotalPicks,
        avg_placement: avgPlacement,
        bayes_placement: bayesPlacement,
        top3_rate: top3Rate,
        win_rate: winRate,
        avg_damage: avgDamage
      };
    };

    const setToast = (type, text) => {
      state.toastMsg = { type, text };
      render();
      clearTimeout(window.__toastTimer);

        render();

    };

      const borderTone =
        meta.rarity === "프리즘"

      const badgeTone =
        meta.rarity === "프리즘"

          : meta.rarity === "골드"
            ? "bg-amber-500/20 text-amber-200 border-amber-400/50"
            : meta.rarity === "전설"
              ? "bg-cyan-500/20 text-cyan-200 border-cyan-400/45"
              : "bg-slate-600/30 text-slate-200 border-slate-400/45";

      const emoji = meta.type === "item" ? "💎" : meta.rarity === "프리즘" ? "💠" : meta.rarity === "골드" ? "🌟" : "🔹";

      return `
        <div class="relative inline-block" data-tooltip-wrap="${escapeHtml(uniqueKey)}">
          <button
            type="button"
            data-action="toggle-tooltip"
            data-tooltip-key="${escapeHtml(uniqueKey)}"
            class="group flex items-center gap-2 pl-1.5 pr-3 py-1.5 rounded-xl border transition-all text-left shadow-sm ${borderTone}"
          >
            ${
              icons.primary
                ? `<img src="${escapeHtml(icons.primary)}" data-fallback="${escapeHtml(icons.fallback)}" data-emoji="${emoji}" alt="${escapeHtml(name)}" loading="lazy" class="w-8 h-8 rounded-lg border border-slate-700/80 object-cover bg-slate-900 shrink-0" onerror="handleImgErr(this)" />`
                : `<span class="w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center text-sm shrink-0">${emoji}</span>`

              </div>

                <button type="button" data-action="switch-view" data-view="plans" class="px-5 py-2.5 rounded-xl bg-hextech-gold/15 hover:bg-hextech-gold/25 border border-hextech-gold/50 text-sm font-extrabold text-hextech-goldLight transition-all">

          </main>
        `;
      }

      const patchSet = new Set();
      Object.values(state.rawChampionsData).forEach((c) => Object.keys(c?.patch_stats || {}).forEach((p) => patchSet.add(p)));
      const availablePatches = Array.from(patchSet).sort((a, b) => {
        const [am, an] = a.split(".").map(Number);
        const [bm, bn] = b.split(".").map(Number);
        return bm !== am ? bm - am : bn - an;
      });

      const combined = {};
      const lowerToCanonical = {};
      Object.values(state.ddChampionsMap).forEach((ddC) => {
        lowerToCanonical[ddC.id.toLowerCase()] = ddC.id;
        combined[ddC.id] = {
          champion_name: ddC.id,
          kr_name: ddC.name,
          roles: ddC.tags || ["Fighter"],
          hasRealData: false,
          best_augments: [],
          best_prismatics: [],
          core_items: [],
          best_partners: []
        };
      });

      Object.entries(state.rawChampionsData).forEach(([rawKey, champ]) => {
        if (!champ || typeof champ !== "object") return;
        const cKey = lowerToCanonical[String(champ.champion_name || rawKey).trim().toLowerCase()] || String(champ.champion_name || rawKey).trim();
        const ddInfo = state.ddChampionsMap[cKey];
        const correctedAugs = (champ.best_augments || []).map((aug) => {
          const fixedName = normalizeAugmentName(aug.name);
          const off = state.cdAugmentMetaMap[fixedName];
          return {
            ...aug,
            name: fixedName,
            rarity: resolveOfficialRarity(off?.rarity || aug.rarity, fixedName),
            icon: off?.icon || aug.icon || aug.icon_url || ""
          };
        });
        combined[cKey] = {
          ...(combined[cKey] || {}),
          ...champ,
          champion_name: cKey,
          kr_name: champ.kr_name && champ.kr_name.toLowerCase() !== cKey.toLowerCase() ? champ.kr_name : ddInfo?.name || cKey,
          roles: ddInfo?.tags && ddInfo.tags.length > 0 ? ddInfo.tags : champ.roles || ["Fighter"],
          best_augments: correctedAugs,
          hasRealData: true
        };
      });

      const enrichedList = Object.values(combined)
        .map((c) => ({ ...c, computedSummary: computePatchFilteredSummary(c, state.selectedPatch, availablePatches) }))
        .sort((a, b) => {
          if (a.hasRealData !== b.hasRealData) return a.hasRealData ? -1 : 1;
          if (a.hasRealData && b.hasRealData) {
            if (a.computedSummary.bayes_placement !== b.computedSummary.bayes_placement) {
              return a.computedSummary.bayes_placement - b.computedSummary.bayes_placement;
            }
            return b.computedSummary.picks - a.computedSummary.picks;
          }
          return (a.kr_name || "").localeCompare(b.kr_name || "", "ko");
        });

      const q = state.searchQuery.trim().toLowerCase();
      const filteredList = enrichedList.filter((c) => {
        if (state.onlyRealData && !c.hasRealData) return false;
        if (state.roleFilter !== "전체") {
          const koRoles = (c.roles || []).map((r) => ROLE_KO_MAP[r] || r);
          if (!koRoles.includes(state.roleFilter)) return false;
        }
        if (state.tierFilter !== "전체" && c.computedSummary.tier_num !== Number(state.tierFilter)) return false;
        if (q) {
          const m1 = (c.kr_name || "").toLowerCase().includes(q);
          const m2 = (c.champion_name || "").toLowerCase().includes(q);
          if (!m1 && !m2) return false;
        }
        return true;
      });

      const activeChamp =
        enrichedList.find((c) => c.champion_name === state.selectedChampKey) || filteredList[0] || enrichedList[0];
      const s = activeChamp?.computedSummary || {};

                    }">
                      <div class="flex items-center gap-2 min-w-0">
                        <span class="text-[11px] font-bold text-slate-500 w-4">${idx + 1}</span>
                        <img src="${escapeHtml(CHAMP_IMG(c.champion_name, state.ddVersion))}" alt="${escapeHtml(c.kr_name)}" loading="lazy" class="w-8 h-8 rounded-lg border border-slate-700 object-cover" onerror="handleImgErr(this)" />

                          <div class="text-xs font-bold text-white truncate">${escapeHtml(c.kr_name)}</div>

                        </div>
                      </div>
                      <span class="px-1.5 py-0.5 rounded text-[10px] font-extrabold border ${badge.cls}">${badge.label}</span>
                    </button>
                  `;
                })
                .join("")}
            </div>
          </aside>

          <section class="lg:col-span-8 xl:col-span-9 space-y-5">
            ${
              activeChamp && activeChamp.hasRealData
                ? `
                  <div class="hextech-card p-6 rounded-2xl flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div class="flex items-center gap-4">
                      <img src="${escapeHtml(CHAMP_IMG(activeChamp.champion_name, state.ddVersion))}" alt="${escapeHtml(activeChamp.kr_name)}" class="w-20 h-20 rounded-2xl border-2 border-hextech-gold/70 object-cover" onerror="handleImgErr(this)" />
                      <div>
                        <h2 class="text-2xl sm:text-3xl font-black text-white">${escapeHtml(activeChamp.kr_name)}</h2>
                        <div class="text-xs text-slate-400 mt-1">${s.picks.toLocaleString()}판 실측 · 평균 ${s.avg_placement}위 · 1등 ${s.win_rate}% · Top 3 ${s.top3_rate}%</div>
                      </div>
                    </div>
                  </div>

                  <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
                    <div class="hextech-card p-5 rounded-2xl space-y-3">
                      <h3 class="text-base font-extrabold text-white pb-2 border-b border-slate-800">⚡ 주요 증강체</h3>
                      ${(activeChamp.best_augments || [])

                        .map(
                          (aug) => `

                                }

                              </div>
                              <span class="px-2 py-0.5 rounded text-[10px] font-bold border ${getRarityPillCls(aug.rarity)}">${escapeHtml(aug.rarity)}</span>
                            </div>

            <div class="max-w-[1480px] mx-auto px-4 sm:px-6 py-3.5 flex flex-wrap items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-400 via-amber-500 to-yellow-700 flex items-center justify-center shadow-lg text-slate-950 font-black text-lg">
                  3v3
                </div>
                <div>
                  <div class="flex items-center gap-2 flex-wrap">
                    <h1 class="text-lg sm:text-xl font-extrabold tracking-tight text-white">
                      LoL 아레나 3v3 공략 가이드 & 실측 분석기
                    </h1>
                    <span class="px-2 py-0.5 rounded-md text-[11px] font-bold bg-teal-500/15 text-teal-300 border border-teal-400/35">
                      6팀 · 18인 모드
                    </span>
                  </div>
                  <div class="text-xs text-slate-400 mt-0.5">
                    ${state.ddSyncState === "ready" ? `🟢 Riot 공식 명칭·아이콘 동기화 (v${escapeHtml(state.ddVersion)})` : "🟡 공식 데이터 동기화 중..."}
                    ${realCount > 0 ? ` · 실측 ${realCount}명 로드됨` : ""}
                  </div>
                </div>
              </div>

              <div class="flex items-center gap-2 flex-wrap">
                <div class="flex items-center bg-slate-900 p-1 rounded-xl border border-slate-700/80">
                  <button
                    type="button"
                    data-action="switch-view"
                    data-view="plans"
                    class="px-3 py-1.5 rounded-lg text-xs font-extrabold transition-all ${
                      state.viewMode === "plans" ? "bg-amber-400 text-slate-950 shadow" : "text-slate-300 hover:text-white"
                    }"
                  >
                    🏆 공용 1등 플랜 (${COMMON_WIN_PLANS.length})
                  </button>
                  <button
                    type="button"
                    data-action="switch-view"
                    data-view="analytics"
                    class="px-3 py-1.5 rounded-lg text-xs font-extrabold transition-all ${
                      state.viewMode === "analytics" ? "bg-teal-400 text-slate-950 shadow" : "text-slate-300 hover:text-white"
                    }"
                  >
                    📊 실측 분석
                  </button>
                </div>

                <button
                  type="button"
                  data-action="trigger-upload"
                  class="px-4 py-2 rounded-xl bg-gradient-to-r from-amber-400 to-amber-500 text-slate-950 font-extrabold text-xs shadow-lg hover:brightness-110 transition-all flex items-center gap-1.5"
                >
                  <span>📂</span>
                  <span>실측 JSON 불러오기</span>
                </button>
              </div>
            </div>
          </header>

          ${state.viewMode === "plans" ? renderCommonPlansHtml() : renderAnalyticsHtml()}
        </div>
      `;

      bindEvents();
    }

    function handleImgErr(imgEl) {
      const fb = imgEl.getAttribute("data-fallback");
      const emoji = imgEl.getAttribute("data-emoji") || "✨";
      if (fb && imgEl.getAttribute("data-tried") !== "1") {
        imgEl.setAttribute("data-tried", "1");
        imgEl.src = fb;
        return;
      }
      const span = document.createElement("span");
      span.className = imgEl.className.replace("object-cover", "") + " bg-slate-800 flex items-center justify-center text-sm";
      span.textContent = emoji;
      imgEl.replaceWith(span);
    }

    function bindEvents() {
      const fileInput = document.getElementById("jsonFileInput");
      if (fileInput) {
        fileInput.onchange = (e) => {
          const f = e.target?.files?.[0];
          if (!f) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            try {
              const parsed = JSON.parse(String(ev.target?.result || "{}"));
              if (!parsed || typeof parsed !== "object" || Array.isArray(parsed) || Object.keys(parsed).length === 0) {
                setToast("error", "올바른 집계 JSON 파일이 아닙니다.");
                return;
              }
              state.rawChampionsData = parsed;
              state.uploadedFileName = f.name;
              state.viewMode = "analytics";
              state.selectedChampKey = Object.keys(parsed)[0] || "";
              setToast("success", `'${f.name}' 로드 완료 (${Object.keys(parsed).length}명)`);
            } catch (err) {
              setToast("error", `JSON 파싱 오류: ${err.message}`);
            }
          };
          reader.readAsText(f, "utf-8");
        };
      }

      document.querySelectorAll("[data-action]").forEach((el) => {
        const action = el.getAttribute("data-action");
        if (action === "toggle-tooltip") {
          const tKey = el.getAttribute("data-tooltip-key");
          el.onclick = (e) => {
            e.stopPropagation();
            state.activeTooltipKey = state.activeTooltipKey === tKey ? null : tKey;
            render();
          };
          const wrap = el.closest("[data-tooltip-wrap]");
          if (wrap) {
            wrap.onmouseenter = () => {
              if (state.activeTooltipKey !== tKey) {
                state.activeTooltipKey = tKey;
                render();
              }
            };
            wrap.onmouseleave = () => {
              if (state.activeTooltipKey === tKey) {
                state.activeTooltipKey = null;
                render();
              }
            };
          }
        } else if (action === "close-tooltip") {
          el.onclick = (e) => {
            e.stopPropagation();
            state.activeTooltipKey = null;
            render();
          };
        } else if (action === "switch-view") {
          el.onclick = () => {
            state.viewMode = el.getAttribute("data-view") || "plans";
            state.activeTooltipKey = null;
            render();
          };
        } else if (action === "select-plan") {
          el.onclick = () => {
            state.selectedPlanId = el.getAttribute("data-plan-id") || "ALL";
            state.activeTooltipKey = null;
            render();
          };
        } else if (action === "trigger-upload") {
          el.onclick = () => document.getElementById("jsonFileInput")?.click();
        } else if (action === "dismiss-toast") {
          el.onclick = () => {
            state.toastMsg = null;
            render();
          };
        } else if (action === "tier-filter") {
          el.onclick = () => {
            state.tierFilter = el.getAttribute("data-tier") || "전체";
            render();
          };
        } else if (action === "select-champ") {
          el.onclick = () => {
            state.selectedChampKey = el.getAttribute("data-champ") || "";
            render();
          };
        }
      });

      const searchInput = document.querySelector('[data-input="search"]');
      if (searchInput) {
        searchInput.oninput = (e) => {
          state.searchQuery = e.target.value;
          render();
          const reInput = document.querySelector('[data-input="search"]');
          if (reInput) {
            reInput.focus();
            reInput.setSelectionRange(reInput.value.length, reInput.value.length);
          }
        };
      }
    }

    document.addEventListener("click", (e) => {
      if (state.activeTooltipKey && !e.target.closest("[data-tooltip-wrap]")) {
        state.activeTooltipKey = null;
        render();
      }
    });

    async function syncOfficialMetadata() {
      try {
        const verRes = await fetch("https://ddragon.leagueoflegends.com/api/versions.json");
        if (!verRes.ok) return;
        const versions = await verRes.json();
        const latestVer = versions?.[0] || FALLBACK_DD_VERSION;

        const [champRes, itemRes, cherryRes, arenaRes] = await Promise.all([
          fetch(`https://ddragon.leagueoflegends.com/cdn/${latestVer}/data/ko_KR/champion.json`),
          fetch(`https://ddragon.leagueoflegends.com/cdn/${latestVer}/data/ko_KR/item.json`),
          fetch(CHERRY_AUGMENTS_KO_URL).catch(() => null),
          fetch(CDRAGON_ARENA_KO_URL).catch(() => null)
        ]);

        if (!champRes.ok || !itemRes.ok) return;
        const [champJson, itemJson] = await Promise.all([champRes.json(), itemRes.json()]);

        const augMap = {};
        const cdItems = {};
        const cdPrismaticItems = {};
        if (cherryRes && cherryRes.ok) {
          const cherryList = await cherryRes.json();
          if (Array.isArray(cherryList)) {
            const numMap = calibrateNumericRarityMap(cherryList);
            cherryList.forEach((aug) => {
              const name = normalizeAugmentName(aug?.nameTRA || aug?.name || "");
              if (!name || name === "???") return;
              augMap[name] = {
                id: Number(aug.id || 0),
                rarity: resolveOfficialRarity(aug.rarity, name, numMap),
                icon: normalizeCDragonAsset(aug.augmentSmallIconPath || aug.augmentLargeIconPath || "")
              };
            });
          }
        }

        if (arenaRes && arenaRes.ok) {
          const arenaJson = await arenaRes.json();
          const rawAugs = arenaJson?.augments || [];
          const numMap = calibrateNumericRarityMap(rawAugs);
          rawAugs.forEach((aug) => {
            const name = normalizeAugmentName(aug?.name || "");
            if (!name || name === "???") return;
            const icon = normalizeCDragonAsset(aug.iconSmall || aug.iconLarge || "");
            if (!augMap[name]) {
              augMap[name] = {
                id: Number(aug.id || 0),
                rarity: resolveOfficialRarity(aug.rarity, name, numMap),
                icon
              };
            } else if (!augMap[name].icon && icon) {
              augMap[name].icon = icon;
            }
          });
          (arenaJson?.items || []).forEach((it) => {
            const iname = String(it?.name || "").trim();
            const iid = Number(it?.id || 0);
            const iconUrl = normalizeCDragonAsset(it?.iconPath || "");
            if (!iname || !iconUrl) return;
            if (iid >= 440000 && iid < 450000) {
              cdPrismaticItems[iname] = iconUrl;
            }
            if (!cdItems[iname] || (iid >= 440000 && iid < 450000)) {
              cdItems[iname] = iconUrl;
            }
          });
        }

        const itemNameMap = {};
        const itemNamePriority = {};
        const prismaticItemIdMap = {};
        Object.entries(itemJson.data || {}).forEach(([idStr, info]) => {
          const iname = String(info?.name || "").trim();
          const iid = Number(idStr);
          if (!iname || !iid) return;
          if (iid >= 440000 && iid < 450000) {
            prismaticItemIdMap[iname] = iid;
          }
          const prio = (iid >= 1000 && iid < 7000) ? 3 : (iid >= 220000 && iid < 230000) ? 2 : 1;
          if (!itemNameMap[iname] || prio > (itemNamePriority[iname] || 0)) {
            itemNameMap[iname] = iid;
            itemNamePriority[iname] = prio;
          }
        });

        state.ddVersion = latestVer;
        state.ddChampionsMap = champJson.data || {};
        state.ddItemNameMap = itemNameMap;
        state.ddPrismaticItemIdMap = prismaticItemIdMap;
        state.cdAugmentMetaMap = augMap;
        state.cdItemIconMap = cdItems;
        state.cdPrismaticIconMap = cdPrismaticItems;
        state.ddSyncState = "ready";
        render();
      } catch (_) {}
    }

    async function tryAutoLoadHostedJson() {
      try {
        const res = await fetch(`./arena_3v3_guide_all_champs.json?t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) return;
        const parsed = await res.json();
        if (parsed && typeof parsed === "object" && !Array.isArray(parsed) && Object.keys(parsed).length > 0) {
          state.rawChampionsData = parsed;
          state.uploadedFileName = "arena_3v3_guide_all_champs.json";
          state.selectedChampKey = Object.keys(parsed)[0] || "";
          render();
        }
      } catch (_) {}
    }

    // 즉시 첫 렌더링 실행
    render();
    syncOfficialMetadata();
    tryAutoLoadHostedJson();
  </script>
</body>
</html>
