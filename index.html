      "궁극기 대변혁": "프리즘", "궁극의 룰렛": "프리즘", "궤도형 레이저": "프리즘", "끝판왕": "프리즘",
      "난공불락": "프리즘", "마법 가속": "프리즘", "미친 과학자": "프리즘", "세월의 지혜": "프리즘",

      "퀘스트: 강철 같은 심장": "골드", "탱크 엔진": "골드", "화염 낙인": "골드", "감쇠 광선": "골드",
      "능력치 더하기 능력치!": "골드", "무법자의 투지": "골드", "불안정한 변형": "골드", "선동": "골드",
      "시작부터 끝까지": "골드", "신성한 중재": "골드", "어둠의 축복": "골드", "영혼 흡수": "골드",
      "인내심": "골드", "죽음의 손길": "골드", "최첨단 발명가": "골드", "치명적 치유": "골드",
      "치명적인 공격": "골드", "퀘스트: 우르프의 챔피언": "골드", "너만을 위해": "골드",

      "소나타": "골드", "소환사 혁명": "골드", "악마의 춤": "골드", "연계의 대가": "골드",
      "점멸 난사": "골드", "축소 엔진": "골드", "퀘스트: 응징의 천사": "골드", "환영 무기": "골드",
      "희생의 의지": "골드", "공생 돌연변이": "골드", "금방 돌아올게": "골드", "급속 성장": "골드",
      "기생 관계": "골드", "끊임없는 회복": "골드", "되풀이": "골드", "밥과 닭고기": "골드",
      "복수": "골드", "부메랑 투척": "골드", "빛의 인도자 결의": "골드", "빛의 파수꾼": "골드",
      "빵과 잼": "골드", "신난다!": "골드", "소멸": "골드",
      // 실버
      "강타자": "실버", "응급처치 키트": "실버", "능수능란": "실버", "음속 폭발": "실버",
      "신성 모독자": "실버", "서리 망령": "실버", "고문자": "실버", "죄책감의 쾌락": "실버",
      "우당탕탕": "실버", "빨랫줄": "실버", "점액 천지": "실버", "불여우": "실버",
      "주스 압착기": "실버", "에너지 충전": "실버",
      // 모자장수 관련 골드 보강
      "퀘스트: 미치광이 모자장수": "골드", "해트트릭": "골드"
    };

    const AUGMENT_NAME_CORRECTIONS = {
      "골리앗": "거인",
      "용기의 거인": "거석상의 용기",
      "거인의 용기": "거석상의 용기",
      "취약점": "취약",
      "인내": "인내심",
      "응급 처치 키트": "응급처치 키트",
      "처형자": "처형 시간",
      "치명적 속도 + 정복자": "전장의 교향곡",
      "모든 것을 바쳐": "너만을 위해"
    };

    const normalizeAugmentName = (rawName) => {
      const n = String(rawName || "").trim();
      return AUGMENT_NAME_CORRECTIONS[n] || n;
    };

    const normalizeCDragonAsset = (rawPath) => {
      if (!rawPath) return "";
      const trimmed = String(rawPath).trim();
      if (trimmed.startsWith("http://") || trimmed.startsWith("https://")) return trimmed;
      let cleaned = trimmed.toLowerCase();
      if (cleaned.startsWith("/lol-game-data/assets/")) {
        cleaned = cleaned.slice("/lol-game-data/assets/".length);
      } else if (cleaned.startsWith("lol-game-data/assets/")) {
        cleaned = cleaned.slice("lol-game-data/assets/".length);
      }
      return CDRAGON_ASSET_PREFIX + cleaned.replace(/^\/+/, "");
    };

    const calibrateNumericRarityMap = (rawAugs = []) => {
      const votes = {};
      const numSet = new Set();
      rawAugs.forEach(a => {
        if (typeof a?.rarity !== "number") return;
        const code = a.rarity;
        numSet.add(code);
        const name = normalizeAugmentName(a.nameTRA || a.name || "");
        const known = OFFICIAL_AUGMENT_RARITY_KO[name];
        if (known) {
          if (!votes[code]) votes[code] = { 실버: 0, 골드: 0, 프리즘: 0 };
          votes[code][known] += 1;
        }
      });
      const result = {};
      Object.entries(votes).forEach(([code, counts]) => {
        const best = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
        if (best && best[1] > 0) result[Number(code)] = best[0];
      });
      const sorted = Array.from(numSet).sort((a, b) => a - b);
      if (Object.keys(result).length < 3 && sorted.length >= 3) {
        if (numSet.has(4) && numSet.has(8)) {
          if (!result[0]) result[0] = "실버";
          if (!result[1]) result[1] = "실버";
          if (!result[4]) result[4] = "골드";
          if (!result[8]) result[8] = "프리즘";
        } else {
          if (!result[sorted[0]]) result[sorted[0]] = "실버";
          if (!result[sorted[1]]) result[sorted[1]] = "골드";
          if (!result[sorted[2]]) result[sorted[2]] = "프리즘";
        }
      }
      return result;
    };

    const resolveOfficialRarity = (rawRarity, augName = "", numMap = {}) => {
      const cleanName = normalizeAugmentName(augName);
      if (OFFICIAL_AUGMENT_RARITY_KO[cleanName]) {
        return OFFICIAL_AUGMENT_RARITY_KO[cleanName];
      }
      if (typeof rawRarity === "string") {
        const lower = rawRarity.trim().toLowerCase();
        if (lower.includes("prism") || lower.includes("프리즘")) return "프리즘";
        if (lower.includes("gold") || lower.includes("골드")) return "골드";
        if (lower.includes("silver") || lower.includes("실버")) return "실버";
        const asNum = Number(lower);
        if (Number.isFinite(asNum)) {
          if (numMap[asNum]) return numMap[asNum];
          if (asNum === 2 || asNum === 8) return "프리즘";
          if (asNum === 1 || asNum === 4) return "골드";
          return "실버";
        }
      }
      if (typeof rawRarity === "number") {
        if (numMap[rawRarity]) return numMap[rawRarity];
        if (rawRarity === 2 || rawRarity === 8) return "프리즘";
        if (rawRarity === 1 || rawRarity === 4) return "골드";
        return "실버";
      }
      return "실버";
    };

    const CHOSUNG_LIST = [
      "ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"
    ];
    const getKoreanChosung = (str) => {
      let out = "";
      for (const ch of String(str || "")) {
        const code = ch.charCodeAt(0) - 0xac00;
        if (code >= 0 && code <= 11171) {
          out += CHOSUNG_LIST[Math.floor(code / 588)];
        } else {
          out += ch.toLowerCase();
        }
      }
      return out;
    };

    const getTierNum = (tier, explicitNum = null) => {
      if (explicitNum && explicitNum >= 1 && explicitNum <= 4) return explicitNum;
      if (tier === "S") return 1;
      if (tier === "A") return 2;
      if (tier === "B") return 3;
      if (tier === "C") return 4;
      return 0;
    };

    const getTierBadgeMeta = (tierNum) => {
      if (tierNum === 1) return { label: "1티어", cls: "bg-sky-500/20 text-sky-300 border-sky-400/50", solid: "bg-sky-500 text-slate-950 border-sky-300" };
      if (tierNum === 2) return { label: "2티어", cls: "bg-emerald-500/20 text-emerald-300 border-emerald-400/50", solid: "bg-emerald-500 text-slate-950 border-emerald-300" };
      if (tierNum === 3) return { label: "3티어", cls: "bg-amber-500/20 text-amber-300 border-amber-400/45", solid: "bg-amber-500 text-slate-950 border-amber-300" };
      if (tierNum === 4) return { label: "4티어", cls: "bg-rose-500/15 text-rose-300 border-rose-500/40", solid: "bg-rose-500 text-white border-rose-300" };
      return { label: "-", cls: "bg-slate-800 text-slate-500 border-slate-700", solid: "bg-slate-700 text-slate-300 border-slate-600" };
    };

    const getRarityPillCls = (rarity) => {
      if (rarity === "프리즘") return "bg-fuchsia-500/20 text-fuchsia-300 border-fuchsia-400/40";
      if (rarity === "골드") return "bg-amber-500/20 text-amber-300 border-amber-400/40";
      return "bg-slate-600/25 text-slate-300 border-slate-500/40";
    };

    const resolveLatestItemIcon = (item, ddVersion, ddItemNameMap = {}, cdItemIconMap = {}, preferCDragon = false) => {
      const name = String(item?.name || "").trim();
      if (preferCDragon && cdItemIconMap[name]) return cdItemIconMap[name];
      const mappedId = item?.id || ddItemNameMap[name];
      if (mappedId) return DD_ITEM_IMG(mappedId, ddVersion);
      return cdItemIconMap[name] || item?.icon || item?.icon_url || "";
    };

    const computeAugmentComposite = (aug, champPicks, champAvg, champWin) => {
      const picks = Number(aug.picks || 0);
      const avg = Number(aug.avg ?? aug.avg_placement ?? champAvg ?? 3.5);
      const win = Number(aug.win ?? aug.win_rate ?? champWin ?? 16.7);
      const top3 = aug.top3_rate != null
        ? Number(aug.top3_rate)
        : Number(Math.min(95, Math.max(15, 50 + (3.5 - avg) * 26)).toFixed(1));
      const pickRate = aug.pick_rate != null
        ? Number(aug.pick_rate)
        : Number(((picks / Math.max(champPicks || 1, 1)) * 100).toFixed(1));

      if (aug.composite_score != null && Number.isFinite(Number(aug.composite_score))) {
        return { ...aug, picks, avg, win, top3_rate: top3, pick_rate: pickRate, composite_score: Number(aug.composite_score) };
      }

      const m = 12;
      const bayesPlace = (picks * avg + m * (champAvg || 3.5)) / (picks + m);
      const bayesWin = (picks * win + m * (champWin || 16.7)) / (picks + m);
      const winScore = Math.min(Math.max((bayesWin / 42) * 100, 0), 100);
      const placeScore = Math.min(Math.max(((4.5 - bayesPlace) / 2.5) * 100, 0), 100);
      const pickScore = Math.min(Math.max((Math.log1p(pickRate) / Math.log1p(24)) * 100, 0), 100);
      const composite = Number((winScore * 0.35 + placeScore * 0.30 + pickScore * 0.35).toFixed(1));

      return { ...aug, picks, avg: Number(avg.toFixed(2)), win: Number(win.toFixed(1)), top3_rate: top3, pick_rate: pickRate, composite_score: composite };
    };

    const computePatchFilteredSummary = (champ, selectedPatch, allPatchesDesc) => {
      if (!champ?.hasRealData) {
        return { tier: "-", tier_num: 0, picks: 0, avg_placement: "-", bayes_placement: 9.99, top3_rate: "-", win_rate: "-", avg_damage: 0 };
      }

      const patchStats = champ.patch_stats || {};
      const patchKeys = Object.keys(patchStats);

      if (patchKeys.length === 0) {
        const s = champ.summary || {};
        const picks = Number(s.picks || 0);
        const avg = Number(s.avg_placement ?? 3.5);
        const bp = Number(s.bayes_placement ?? ((picks * avg + 25 * 3.5) / (picks + 25)));
        const tier = picks < 20 ? "B" : bp <= 3.32 ? "S" : bp <= 3.46 ? "A" : bp <= 3.60 ? "B" : "C";
        return {
          tier,
          tier_num: getTierNum(tier, s.tier_num ?? s.opgg_tier),
          picks,
          avg_placement: Number(avg.toFixed(2)),
          bayes_placement: Number(bp.toFixed(2)),
          top3_rate: Number((s.top3_rate ?? 50).toFixed(1)),
          win_rate: Number((s.win_rate ?? 16.7).toFixed(1)),
          avg_damage: Math.round(s.avg_damage || 0)
        };
      }

      const weightCurve = [1.0, 0.75, 0.5, 0.35, 0.25];
      const patchWeightMap = {};
      allPatchesDesc.forEach((p, i) => {
        patchWeightMap[p] = weightCurve[Math.min(i, weightCurve.length - 1)];
      });

      const targetKeys = selectedPatch === "ALL" ? patchKeys : (patchStats[selectedPatch] ? [selectedPatch] : []);
      if (targetKeys.length === 0) {
        return { tier: "-", tier_num: 0, picks: 0, avg_placement: "-", bayes_placement: 9.99, top3_rate: "-", win_rate: "-", avg_damage: 0 };
      }

      let rawTotalPicks = 0;
      let weightedPicksSum = 0;
      let weightedPlaceSum = 0;
      let weightedTop3Sum = 0;
      let weightedWinSum = 0;
      let weightedDmgSum = 0;

      targetKeys.forEach(pKey => {
        const st = patchStats[pKey];
        const n = Number(st.picks || 0);
        if (n <= 0) return;
        const w = selectedPatch === "ALL" ? (patchWeightMap[pKey] ?? 0.5) : 1.0;
        const effN = n * w;
        rawTotalPicks += n;
        weightedPicksSum += effN;
        weightedPlaceSum += Number(st.avg_placement || 3.5) * effN;
        weightedTop3Sum += Number(st.top3_rate || 50) * effN;
        weightedWinSum += Number(st.win_rate || 16.7) * effN;
        weightedDmgSum += Number(st.avg_damage || 0) * effN;
      });

      if (rawTotalPicks === 0 || weightedPicksSum <= 0) {
        return { tier: "-", tier_num: 0, picks: 0, avg_placement: "-", bayes_placement: 9.99, top3_rate: "-", win_rate: "-", avg_damage: 0 };
      }

      const avgPlacement = Number((weightedPlaceSum / weightedPicksSum).toFixed(2));
      const bayesPlacement = Number(((weightedPicksSum * avgPlacement + 25 * 3.5) / (weightedPicksSum + 25)).toFixed(2));
      const top3Rate = Number((weightedTop3Sum / weightedPicksSum).toFixed(1));
      const winRate = Number((weightedWinSum / weightedPicksSum).toFixed(1));
      const avgDamage = Math.round(weightedDmgSum / weightedPicksSum);
      const tier = rawTotalPicks < 20 ? "B" : bayesPlacement <= 3.32 ? "S" : bayesPlacement <= 3.46 ? "A" : bayesPlacement <= 3.60 ? "B" : "C";

      return {
        tier,
        tier_num: getTierNum(tier, champ.summary?.tier_num ?? champ.summary?.opgg_tier),
        picks: rawTotalPicks,
        avg_placement: avgPlacement,
        bayes_placement: bayesPlacement,
        top3_rate: top3Rate,
        win_rate: winRate,
        avg_damage: avgDamage
      };
    };

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, errorMsg: "" };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, errorMsg: error?.message || "렌더링 오류가 발생했습니다." };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex items-center justify-center p-6">
              <div className="hextech-card max-w-md w-full p-6 rounded-2xl text-center space-y-4">
                <div className="text-3xl">⚠️</div>
                <h2 className="text-lg font-bold text-white">화면 표시 중 오류가 발생했습니다</h2>
                <p className="text-xs text-slate-400 break-all">{this.state.errorMsg}</p>
                <button
                  onClick={() => window.location.reload()}
                  className="px-4 py-2 rounded-xl bg-hextech-gold text-hextech-bg font-bold text-sm"
                >
                  새로고침
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function SafeIcon({ src, fallbackSrc = "", alt = "", className = "w-10 h-10 rounded-lg", emojiFallback = "✨" }) {
      const [currentSrc, setCurrentSrc] = useState(src || fallbackSrc || "");
      const [triedFallback, setTriedFallback] = useState(false);
      const [failed, setFailed] = useState(!(src || fallbackSrc));

      useEffect(() => {
        setCurrentSrc(src || fallbackSrc || "");
        setTriedFallback(false);
        setFailed(!(src || fallbackSrc));
      }, [src, fallbackSrc]);

      if (failed || !currentSrc) {
        return (
          <div
            className={`${className} bg-slate-800/90 border border-slate-700 flex items-center justify-center text-slate-300 text-sm font-bold shrink-0 select-none`}
            title={alt}
          >
            {emojiFallback}
          </div>
        );
      }

      return (
        <img
          src={currentSrc}
          alt={alt}
          loading="lazy"
          className={`${className} object-cover shrink-0 bg-slate-900`}
          onError={() => {
            if (!triedFallback && fallbackSrc && fallbackSrc !== currentSrc) {
              setTriedFallback(true);
              setCurrentSrc(fallbackSrc);
            } else {
              setFailed(true);
            }
          }}
        />
      );
    }

        summary: "아레나 3v3 핵심 시너지 파츠입니다.",
        details: []
      };

      // 외부 클릭 시 모바일 팝업 닫기
      useEffect(() => {
        if (!isOpen) return;
        const handleOutside = (e) => {
          if (wrapRef.current && !wrapRef.current.contains(e.target)) {
            setIsOpen(false);
          }
        };
        document.addEventListener("mousedown", handleOutside);
        document.addEventListener("touchstart", handleOutside);
        return () => {
          document.removeEventListener("mousedown", handleOutside);
          document.removeEventListener("touchstart", handleOutside);
        };
      }, [isOpen]);

      // 공식 아이콘 자동 탐색 (이름 + 별칭 + itemId 폴백)
      const { iconUrl, fallbackUrl } = useMemo(() => {
        const candidates = [name, ...(meta.aliases || [])];
        if (meta.type === "item") {
          let cdIcon = "";
          let ddId = meta.itemId || null;
          for (const c of candidates) {
            if (!cdIcon && cdItemIconMap[c]) cdIcon = cdItemIconMap[c];
            if (!ddId && ddItemNameMap[c]) ddId = ddItemNameMap[c];
          }
          const ddIcon = ddId ? DD_ITEM_IMG(ddId, ddVersion) : "";
          const isPrismatic = meta.rarity === "프리즘";
          return {
            iconUrl: isPrismatic ? (cdIcon || ddIcon) : (ddIcon || cdIcon),
            fallbackUrl: isPrismatic ? ddIcon : cdIcon
          };
        } else {
          let augIcon = "";
          for (const c of candidates) {
            const fixed = normalizeAugmentName(c);
            if (cdAugmentMetaMap[fixed]?.icon) {
              augIcon = cdAugmentMetaMap[fixed].icon;
              break;
            }
          }
          return { iconUrl: augIcon, fallbackUrl: "" };
        }
      }, [name, meta, ddVersion, ddItemNameMap, cdItemIconMap, cdAugmentMetaMap]);

      const borderTone =
        meta.rarity === "프리즘"
          ? "border-fuchsia-400/55 bg-fuchsia-950/35 hover:border-fuchsia-300"
          : meta.rarity === "골드"
            ? "border-amber-400/50 bg-amber-950/30 hover:border-amber-300"
            : meta.rarity === "전설"
              ? "border-hextech-cyan/50 bg-cyan-950/30 hover:border-hextech-cyan"
              : "border-slate-500/55 bg-slate-800/60 hover:border-slate-300";

      const badgeTone =
        meta.rarity === "프리즘"
          ? "bg-fuchsia-500/20 text-fuchsia-200 border-fuchsia-400/50"
          : meta.rarity === "골드"
            ? "bg-amber-500/20 text-amber-200 border-amber-400/50"
            : meta.rarity === "전설"
              ? "bg-hextech-cyan/20 text-hextech-cyan border-hextech-cyan/45"
              : "bg-slate-600/30 text-slate-200 border-slate-400/45";

      return (
        <div
          ref={wrapRef}
          className="relative inline-block"
          onMouseEnter={() => setIsOpen(true)}
          onMouseLeave={() => setIsOpen(false)}
        >
          <button
            type="button"
            onClick={() => setIsOpen(prev => !prev)}
            className={`group flex items-center gap-2 pl-1.5 pr-3 py-1.5 rounded-xl border transition-all text-left shadow-sm ${borderTone}`}
          >
            <SafeIcon
              src={iconUrl}
              fallbackSrc={fallbackUrl}
              alt={name}
              className="w-8 h-8 rounded-lg border border-slate-700/80"
              emojiFallback={meta.type === "item" ? "💎" : meta.rarity === "프리즘" ? "💠" : meta.rarity === "골드" ? "🌟" : "🔹"}
            />
            <div className="leading-tight">
              <div className="text-xs font-extrabold text-white group-hover:text-hextech-goldLight transition-colors flex items-center gap-1">
                <span>{name}</span>
              </div>
              <div className="text-[10px] text-slate-400 font-semibold">
                {meta.type === "item" ? `${meta.rarity} 아이템` : `${meta.rarity} 증강`}
                {meta.tag ? ` · ${meta.tag}` : ""}
              </div>
            </div>
          </button>

          {isOpen && (
            <div
              role="tooltip"
              className="tooltip-pop absolute z-50 left-0 sm:left-1/2 sm:-translate-x-1/2 bottom-full mb-2.5 w-[290px] sm:w-[340px] max-w-[88vw] rounded-2xl bg-slate-950/98 border border-hextech-gold/55 shadow-2xl p-4 backdrop-blur-xl pointer-events-auto"
            >
              <div className="flex items-start gap-3 pb-2.5 border-b border-slate-800">
                <SafeIcon
                  src={iconUrl}
                  fallbackSrc={fallbackUrl}
                  alt={name}
                  className="w-11 h-11 rounded-xl border border-hextech-gold/50 shrink-0"
                  emojiFallback={meta.type === "item" ? "💎" : "✨"}
                />
                <div className="min-w-0 flex-1">
                  <div className="flex items-center gap-1.5 flex-wrap">
                    <span className="text-sm font-black text-white">{name}</span>
                    <span className={`px-1.5 py-0.5 rounded text-[10px] font-bold border ${badgeTone}`}>
                      {meta.rarity} {meta.type === "item" ? "아이템" : "증강"}
                    </span>
                  </div>
                  {meta.stats && (
                    <div className="text-[11px] font-semibold text-hextech-cyan mt-1">{meta.stats}</div>
                  )}
                  {meta.tag && !meta.stats && (
                    <div className="text-[11px] font-semibold text-hextech-goldLight mt-1">{meta.tag}</div>
                  )}
                </div>
              </div>

              <div className="pt-2.5 space-y-2 text-xs leading-relaxed text-slate-200">
                <p>{meta.summary}</p>

                )}

            </div>
          )}
        </div>
      );
    }

    // =========================================================================

    function ArenaGuideApp() {
      const [rawChampionsData, setRawChampionsData] = useState({});
      const [uploadedFileName, setUploadedFileName] = useState("");
      const [autoLoadState, setAutoLoadState] = useState("loading"); // loading | loaded | none
      const [lastSyncedAt, setLastSyncedAt] = useState("");
      const [toastMsg, setToastMsg] = useState(null);

      // Riot 공식 메타데이터 (명칭·등급·아이콘만 동기화)
      const [ddVersion, setDdVersion] = useState(FALLBACK_DD_VERSION);
      const [ddChampionsMap, setDdChampionsMap] = useState({});
      const [ddItemNameMap, setDdItemNameMap] = useState({});
      const [cdAugmentMetaMap, setCdAugmentMetaMap] = useState({});
      const [cdItemIconMap, setCdItemIconMap] = useState({});
      const [ddSyncState, setDdSyncState] = useState("loading");

      // UI 상태
      const [viewMode, setViewMode] = useState("analytics"); // analytics | plans
      const [selectedChampKey, setSelectedChampKey] = useState("");
      const [activeTab, setActiveTab] = useState("build");
      const [searchQuery, setSearchQuery] = useState("");
      const [roleFilter, setRoleFilter] = useState("전체");
      const [tierFilter, setTierFilter] = useState("전체");
      const [onlyRealData, setOnlyRealData] = useState(false);
      const [selectedPatch, setSelectedPatch] = useState("ALL");
      const [rarityFilter, setRarityFilter] = useState("전체");
      const [augmentSort, setAugmentSort] = useState("composite");
      const [isDragging, setIsDragging] = useState(false);

      const fileInputRef = useRef(null);
      const detailTopRef = useRef(null);

      const hasUploadedData = Object.keys(rawChampionsData).length > 0;

      const showToast = (type, text) => setToastMsg({ type, text });

      useEffect(() => {
        if (!toastMsg) return;
        const timer = setTimeout(() => setToastMsg(null), 5000);
        return () => clearTimeout(timer);
      }, [toastMsg]);

      // Riot Data Dragon + cherry-augments.json (1순위) + cdragon/arena (2순위) 동기화
      useEffect(() => {
        let cancelled = false;
        const syncMetadata = async () => {
          try {
            const verRes = await fetch("https://ddragon.leagueoflegends.com/api/versions.json");
            if (!verRes.ok) throw new Error("versions fetch failed");
            const versions = await verRes.json();
            const latestVer = versions?.[0] || FALLBACK_DD_VERSION;

            const [champRes, itemRes, cherryRes, arenaRes] = await Promise.all([
              fetch(`https://ddragon.leagueoflegends.com/cdn/${latestVer}/data/ko_KR/champion.json`),
              fetch(`https://ddragon.leagueoflegends.com/cdn/${latestVer}/data/ko_KR/item.json`),
              fetch(CHERRY_AUGMENTS_KO_URL).catch(() => null),
              fetch(CDRAGON_ARENA_KO_URL).catch(() => null)
            ]);

            if (!champRes.ok || !itemRes.ok) throw new Error("ddragon fetch failed");
            const [champJson, itemJson] = await Promise.all([champRes.json(), itemRes.json()]);

            const augMetaMap = {};
            const cdItemIcons = {};

            if (cherryRes && cherryRes.ok) {
              try {
                const cherryList = await cherryRes.json();
                if (Array.isArray(cherryList)) {
                  const cherryNumMap = calibrateNumericRarityMap(cherryList);
                  cherryList.forEach(aug => {
                    const name = normalizeAugmentName(aug?.nameTRA || aug?.name || "");
                    if (!name || name === "???") return;
                    augMetaMap[name] = {
                      id: Number(aug.id || 0),
                      rarity: resolveOfficialRarity(aug.rarity, name, cherryNumMap),
                      icon: normalizeCDragonAsset(aug.augmentSmallIconPath || aug.augmentLargeIconPath || "")
                    };
                  });
                }
              } catch (_) {}
            }

            if (arenaRes && arenaRes.ok) {
              try {
                const arenaJson = await arenaRes.json();
                const rawAugs = arenaJson?.augments || [];
                const numRarityMap = calibrateNumericRarityMap(rawAugs);

                rawAugs.forEach(aug => {
                  const name = normalizeAugmentName(aug?.name || "");
                  if (!name || name === "???") return;
                  const icon = normalizeCDragonAsset(aug.iconSmall || aug.iconLarge || "");
                  if (augMetaMap[name]) {
                    if (!augMetaMap[name].icon && icon) augMetaMap[name].icon = icon;
                    return;
                  }
                  augMetaMap[name] = {
                    id: Number(aug.id || 0),
                    rarity: resolveOfficialRarity(aug.rarity, name, numRarityMap),
                    icon
                  };
                });

                (arenaJson?.items || []).forEach(it => {
                  const iname = String(it?.name || "").trim();
                  const iconUrl = normalizeCDragonAsset(it?.iconPath || "");
                  if (iname && iconUrl) cdItemIcons[iname] = iconUrl;
                });
              } catch (_) {}
            }

            if (cancelled) return;

            const getItemPriority = (idStr) => {
              const id = Number(idStr);
              if (id >= 1000 && id < 7000) return 3;
              if ((id >= 220000 && id < 230000) || (id >= 440000 && id < 450000)) return 2;
              return 1;
            };

            const itemNameMap = {};
            const itemPriorityMap = {};
            Object.entries(itemJson.data || {}).forEach(([idStr, info]) => {
              const itemName = String(info?.name || "").trim();
              if (!itemName) return;
              const prio = getItemPriority(idStr);
              if (!itemNameMap[itemName] || prio > (itemPriorityMap[itemName] || 0)) {
                itemNameMap[itemName] = Number(idStr);
                itemPriorityMap[itemName] = prio;
              }
            });

            setDdVersion(latestVer);
            setDdChampionsMap(champJson.data || {});
            setDdItemNameMap(itemNameMap);
            setCdAugmentMetaMap(augMetaMap);
            setCdItemIconMap(cdItemIcons);
            setDdSyncState("ready");
          } catch (_) {
            if (!cancelled) setDdSyncState("fallback");
          }
        };
        syncMetadata();
        return () => { cancelled = true; };
      }, []);

      // 같은 경로의 최신 arena_3v3_guide_all_champs.json 자동 로드 (GitHub Pages 연동용)
      const fetchHostedGuideJson = async (isManualRefresh = false) => {
        setAutoLoadState("loading");
        try {
          const res = await fetch(`./arena_3v3_guide_all_champs.json?t=${Date.now()}`, {
            cache: "no-store"
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const parsed = await res.json();
          if (!parsed || typeof parsed !== "object" || Array.isArray(parsed) || Object.keys(parsed).length === 0) {
            throw new Error("empty json");
          }

          setRawChampionsData(parsed);
          setUploadedFileName("arena_3v3_guide_all_champs.json (자동 동기화)");
          setOnlyRealData(true);
          setAutoLoadState("loaded");

          const lastMod = res.headers.get("last-modified");
          if (lastMod) {
            const d = new Date(lastMod);
            if (!Number.isNaN(d.getTime())) {
              setLastSyncedAt(d.toLocaleString("ko-KR", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }));
            }
          }

          const firstBestKey = Object.keys(parsed).sort((a, b) => {
            const ap = parsed[a]?.summary?.bayes_placement ?? 9;
            const bp = parsed[b]?.summary?.bayes_placement ?? 9;
            return ap - bp;
          })[0];
          if (firstBestKey && !selectedChampKey) {
            setSelectedChampKey(firstBestKey);
          }

          if (isManualRefresh) {
            showToast("success", `최신 서버 JSON(${Object.keys(parsed).length}명)을 새로 불러왔습니다.`);
          }
        } catch (_) {
          setAutoLoadState("none");
          if (isManualRefresh) {
            showToast("info", "자동 호스팅된 JSON을 찾을 수 없습니다. 로컬 JSON 파일을 직접 올려주세요.");
          }
        }
      };

      useEffect(() => {
        fetchHostedGuideJson(false);
      }, []);

      const availablePatches = useMemo(() => {
        const patchSet = new Set();
        Object.values(rawChampionsData).forEach(champ => {
          Object.keys(champ?.patch_stats || {}).forEach(p => patchSet.add(p));
        });
        return Array.from(patchSet).sort((a, b) => {
          const [amaj, amin] = a.split(".").map(Number);
          const [bmaj, bmin] = b.split(".").map(Number);
          if (bmaj !== amaj) return bmaj - amaj;
          return bmin - amin;
        });
      }, [rawChampionsData]);

      const mergedAllRawChampions = useMemo(() => {
        const combined = {};
        const lowerToCanonicalKey = {};

        Object.values(ddChampionsMap).forEach(ddChamp => {
          const key = ddChamp.id;
          lowerToCanonicalKey[key.toLowerCase()] = key;
          combined[key] = {
            champion_name: key,
            kr_name: ddChamp.name,
            roles: ddChamp.tags || ["Fighter"],
            hasRealData: false,
            best_augments: [],
            best_prismatics: [],
            core_items: [],
            best_partners: []
          };
        });

        const resolveCanonicalKey = (rawKey) => {
          const k = String(rawKey || "").trim();
          if (!k) return "";
          return lowerToCanonicalKey[k.toLowerCase()] || k;
        };

        Object.entries(rawChampionsData || {}).forEach(([rawKey, champ]) => {
          if (!champ || typeof champ !== "object") return;
          const canonicalKey = resolveCanonicalKey(champ.champion_name || rawKey);
          if (!canonicalKey) return;
          const ddInfo = ddChampionsMap[canonicalKey];

          const correctedAugments = (champ.best_augments || []).map(aug => {
            const fixedName = normalizeAugmentName(aug.name);
            const official = cdAugmentMetaMap[fixedName];
            const verifiedRarity = resolveOfficialRarity(official?.rarity || aug.rarity, fixedName);
            return {
              ...aug,
              name: fixedName,
              rarity: verifiedRarity,
              icon: official?.icon || aug.icon || aug.icon_url || "",
              icon_url: official?.icon || aug.icon_url || aug.icon || ""
            };
          });

          const correctedPartners = (champ.best_partners || []).map(pt => {
            const pKey = resolveCanonicalKey(pt.partner || pt.champion);
            const pDd = ddChampionsMap[pKey];
            return {
              ...pt,
              partner: pKey,
              champion: pKey,
              name: pDd?.name || pt.name || pKey
            };
          });

          const rawKrName = champ.kr_name;
          const isFallbackEng = !rawKrName || rawKrName.toLowerCase() === canonicalKey.toLowerCase();

          combined[canonicalKey] = {
            ...(combined[canonicalKey] || {}),
            ...champ,
            champion_name: canonicalKey,
            kr_name: (!isFallbackEng ? rawKrName : null) || ddInfo?.name || canonicalKey,
            roles: (ddInfo?.tags && ddInfo.tags.length > 0) ? ddInfo.tags : (champ.roles || ["Fighter"]),
            best_augments: correctedAugments,
            best_partners: correctedPartners,
            hasRealData: true
          };
        });

        return combined;
      }, [ddChampionsMap, rawChampionsData, cdAugmentMetaMap]);

      const enrichedChampionsList = useMemo(() => {
        return Object.values(mergedAllRawChampions).map(champ => ({
          ...champ,
          computedSummary: computePatchFilteredSummary(champ, selectedPatch, availablePatches),
          chosung: getKoreanChosung(champ.kr_name)
        })).sort((a, b) => {
          if (a.hasRealData !== b.hasRealData) return a.hasRealData ? -1 : 1;
          if (a.hasRealData && b.hasRealData) {
            if (a.computedSummary.picks === 0 && b.computedSummary.picks > 0) return 1;
            if (b.computedSummary.picks === 0 && a.computedSummary.picks > 0) return -1;
            if (a.computedSummary.bayes_placement !== b.computedSummary.bayes_placement) {
              return a.computedSummary.bayes_placement - b.computedSummary.bayes_placement;
            }
            return b.computedSummary.picks - a.computedSummary.picks;
          }
          return (a.kr_name || "").localeCompare(b.kr_name || "", "ko");
        });
      }, [mergedAllRawChampions, selectedPatch, availablePatches]);

      const filteredChampions = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        return enrichedChampionsList.filter(c => {
          if (onlyRealData && !c.hasRealData) return false;
          if (roleFilter !== "전체") {
            const koRoles = (c.roles || []).map(r => ROLE_KO_MAP[r] || r);
            if (!koRoles.includes(roleFilter)) return false;
          }
          if (tierFilter !== "전체") {
            if (c.computedSummary.tier_num !== Number(tierFilter)) return false;
          }
          if (q) {
            const krMatch = (c.kr_name || "").toLowerCase().includes(q);
            const enMatch = (c.champion_name || "").toLowerCase().includes(q);
            const chosungMatch = (c.chosung || "").includes(q);
            if (!krMatch && !enMatch && !chosungMatch) return false;
          }
          return true;
        });
      }, [enrichedChampionsList, onlyRealData, roleFilter, tierFilter, searchQuery]);

      const activeChamp = useMemo(() => {
        if (!selectedChampKey) return filteredChampions[0] || enrichedChampionsList[0] || null;
        return enrichedChampionsList.find(c => c.champion_name === selectedChampKey) || filteredChampions[0] || null;
      }, [enrichedChampionsList, filteredChampions, selectedChampKey]);

      const processedAugments = useMemo(() => {
        if (!activeChamp?.hasRealData) return [];
        const baseList = activeChamp.best_augments || [];
        const champPicks = activeChamp.computedSummary.picks || 100;
        const champAvg = typeof activeChamp.computedSummary.avg_placement === "number" ? activeChamp.computedSummary.avg_placement : 3.5;
        const champWin = typeof activeChamp.computedSummary.win_rate === "number" ? activeChamp.computedSummary.win_rate : 16.7;

        const enriched = baseList.map(aug => {
          const fixedName = normalizeAugmentName(aug.name);
          const official = cdAugmentMetaMap[fixedName];
          const withMeta = {
            ...aug,
            name: fixedName,
            rarity: resolveOfficialRarity(official?.rarity || aug.rarity, fixedName),
            icon: official?.icon || aug.icon || aug.icon_url || ""
          };
          return computeAugmentComposite(withMeta, champPicks, champAvg, champWin);
        });

        const filtered = rarityFilter === "전체" ? enriched : enriched.filter(a => a.rarity === rarityFilter);

        return [...filtered].sort((a, b) => {
          if (augmentSort === "top3") return (b.top3_rate - a.top3_rate) || (b.picks - a.picks);
          if (augmentSort === "win") return (b.win - a.win) || (b.picks - a.picks);
          if (augmentSort === "pick") return (b.pick_rate - a.pick_rate) || (b.picks - a.picks);
          if (augmentSort === "avg") return (a.avg - b.avg) || (b.picks - a.picks);
          return (b.composite_score - a.composite_score) || (b.picks - a.picks);
        });
      }, [activeChamp, rarityFilter, augmentSort, cdAugmentMetaMap]);

      const augmentRarityCounts = useMemo(() => {
        const counts = { 전체: 0, 프리즘: 0, 골드: 0, 실버: 0 };
        if (!activeChamp?.hasRealData) return counts;
        const list = activeChamp.best_augments || [];
        counts.전체 = list.length;
        list.forEach(a => {
          const fixedName = normalizeAugmentName(a.name);
          const r = resolveOfficialRarity(cdAugmentMetaMap[fixedName]?.rarity || a.rarity, fixedName);
          if (counts[r] != null) counts[r] += 1;
        });
        return counts;
      }, [activeChamp, cdAugmentMetaMap]);

        const realChamps = enrichedChampionsList.filter(c => c.hasRealData);

        return {

      const handleFileLoad = (file) => {

              return;

            setRawChampionsData(parsed);
            setUploadedFileName(file.name);
            setSelectedPatch("ALL");
            setTierFilter("전체");
            setRoleFilter("전체");
            setOnlyRealData(true);

            const firstBestKey = keys.sort((a, b) => {
              const ap = parsed[a]?.summary?.bayes_placement ?? 9;
              const bp = parsed[b]?.summary?.bayes_placement ?? 9;
              return ap - bp;
            })[0];
            if (firstBestKey) {

            }

            showToast("success", `'${file.name}' 로드 완료! 실측 챔피언 ${keys.length}명의 데이터에 공식 한글 명칭·등급을 적용했습니다.`);
          } catch (err) {
            showToast("error", `JSON 파싱 오류: ${err.message}`);
          }
        };
        reader.onerror = () => showToast("error", "파일을 읽는 중 오류가 발생했습니다.");
        reader.readAsText(file, "utf-8");
      };

                                    <td className="py-3 pr-2 text-right text-sm font-extrabold text-sky-300">{aug.top3_rate}%</td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        ) : (
                          <div className="p-8 rounded-xl bg-slate-900/60 border border-slate-800 text-center text-xs text-slate-400">
                            선택한 등급({rarityFilter})에 해당하는 실측 증강 데이터가 없습니다.
                          </div>
                        )}
                      </div>
                    )}

                    {/* 아이템 전용 탭 */}
                    {activeTab === "items" && (
                      <div className="grid grid-cols-1 xl:grid-cols-2 gap-6">
                        <div className="hextech-card p-6 rounded-2xl space-y-3">
                          <h3 className="text-lg font-extrabold text-white pb-3 border-b border-slate-800">💎 프리즘 아이템</h3>
                          {(activeChamp.best_prismatics || []).map((item, idx) => (
                            <div key={idx} className="prismatic-border bg-slate-900/85 p-3.5 rounded-xl flex items-center justify-between gap-3">
                              <div className="flex items-center gap-3 min-w-0">
                                <SafeIcon
                                  src={resolveLatestItemIcon(item, ddVersion, ddItemNameMap, cdItemIconMap, true)}
                                  fallbackSrc={resolveLatestItemIcon(item, ddVersion, ddItemNameMap, cdItemIconMap, false)}
                                  alt={item.name}
                                  className="w-11 h-11 rounded-lg border border-fuchsia-400/40"
                                  emojiFallback="💎"
                                />
                                <div className="min-w-0">
                                  <div className="text-sm font-bold text-white truncate">{item.name}</div>
                                  <div className="text-[11px] text-slate-400">픽률 {item.pick_rate ?? "-"}% · {item.picks}판</div>
                                </div>
                              </div>
                              <div className="text-right shrink-0">
                                <div className="text-xs font-extrabold text-hextech-goldLight">평균 {item.avg ?? item.avg_placement}위</div>
                                <div className="text-[11px] text-emerald-400 font-semibold">1등 {item.win ?? item.win_rate}%</div>
                              </div>
                            </div>
                          ))}
                        </div>

                        <div className="hextech-card p-6 rounded-2xl space-y-3">
                          <h3 className="text-lg font-extrabold text-white pb-3 border-b border-slate-800">🛡️ 핵심 코어 아이템</h3>
                          {(activeChamp.core_items || []).map((item, idx) => (
                            <div key={idx} className="bg-slate-900/80 p-3.5 rounded-xl border border-slate-800 flex items-center justify-between gap-3">
                              <div className="flex items-center gap-3 min-w-0">
                                <SafeIcon
                                  src={resolveLatestItemIcon(item, ddVersion, ddItemNameMap, cdItemIconMap, false)}
                                  fallbackSrc={cdItemIconMap[item.name] || item.icon || item.icon_url}
                                  alt={item.name}
                                  className="w-11 h-11 rounded-lg border border-slate-700"
                                  emojiFallback="🗡️"
                                />
                                <div className="min-w-0">
                                  <div className="text-sm font-bold text-white truncate">{item.name}</div>
                                  <div className="text-[11px] text-slate-400">픽률 {item.pick_rate ?? "-"}% · {item.picks}판</div>
                                </div>
                              </div>
                              <div className="text-right shrink-0">
                                <div className="text-xs font-extrabold text-hextech-goldLight">평균 {item.avg ?? item.avg_placement}위</div>
                                {item.top3_rate != null && <div className="text-[11px] text-sky-300 font-semibold">Top3 {item.top3_rate}%</div>}
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* 파트너 조합 탭 */}
                    {activeTab === "synergies" && (
                      <div className="hextech-card p-6 rounded-2xl space-y-4">
                        <h3 className="text-lg font-extrabold text-white pb-3 border-b border-slate-800">🤝 {activeChamp.kr_name} 3v3 파트너 시너지</h3>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5">
                          {(activeChamp.best_partners || []).map((pt, idx) => {
                            const pKey = pt.partner || pt.champion;
                            return (
                              <button
                                key={`${pKey}-${idx}`}
                                onClick={() => handleSelectChampion(pKey)}
                                className="text-left bg-slate-900/80 hover:bg-slate-800/85 border border-slate-800 hover:border-hextech-gold/60 p-4 rounded-xl transition-all flex items-center justify-between gap-3"
                              >
                                <div className="flex items-center gap-3 min-w-0">
                                  <SafeIcon src={CHAMP_IMG(pKey, ddVersion)} alt={pt.name || pKey} className="w-12 h-12 rounded-xl border border-slate-700" emojiFallback="🤝" />
                                  <div className="min-w-0">
                                    <div className="font-bold text-sm text-white truncate">{pt.name || pKey}</div>
                                    <div className="text-[11px] text-slate-400">{pt.games}판</div>
                                  </div>
                                </div>
                                <div className="text-right shrink-0">
                                  <div className="text-xs font-extrabold text-hextech-goldLight">평균 {pt.avg ?? pt.avg_placement}위</div>
                                  {pt.win_rate != null && <div className="text-[11px] text-emerald-400 font-semibold">1등 {pt.win_rate}%</div>}
                                  {pt.top3_rate != null && <div className="text-[11px] text-sky-300 font-semibold">Top3 {pt.top3_rate}%</div>}
                                </div>
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    )}
                  </>
                ) : (
                  <div className="hextech-card p-12 rounded-2xl text-center space-y-2">
                    <div className="text-2xl">📭</div>
                    <div className="text-sm font-bold text-white">{activeChamp?.kr_name || "선택한 챔피언"}의 수집된 매치 데이터가 없습니다.</div>
                    <p className="text-xs text-slate-400">좌측 목록에서 실측 데이터가 있는 챔피언을 선택하거나, 더 많은 매치를 수집한 JSON을 업로드해 주세요.</p>
                  </div>
                )}
              </section>
            </main>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(
      <ErrorBoundary>
        <ArenaGuideApp />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
