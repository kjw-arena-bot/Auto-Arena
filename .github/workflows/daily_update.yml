name: Daily Arena 3v3 Data Update

on:
  schedule:
    - cron: "0 17 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      max_new_matches:
        description: "Max new 3v3 matches to collect"
        required: false
        default: "3000"
      aggregate_only:
        description: "Re-aggregate checkpoint only (true or false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --upgrade pip requests

      - name: Run Arena 3v3 collector
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          AGGREGATE_ONLY: ${{ github.event.inputs.aggregate_only || 'false' }}
          MAX_NEW_MATCHES: ${{ github.event.inputs.max_new_matches || '3000' }}
          ROUTING_REGION: "asia"
        run: python arena_3v3_collector.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch arena_3v3_checkpoint.jsonl
          [ -f arena_3v3_checkpoint.jsonl.gz ] && git add arena_3v3_checkpoint.jsonl.gz
          [ -f arena_3v3_guide_all_champs.json ] && git add arena_3v3_guide_all_champs.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: daily arena 3v3 stats update ($(date -u +'%Y-%m-%d'))"
            git pull --rebase origin main
            git push
          fi
